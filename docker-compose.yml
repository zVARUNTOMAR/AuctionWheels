services:
  postgres:
    image: postgres
    ports:
      - 5432:5432
    volumes:
      - pgData:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=varunpost
      - POSTGRES_USER=postgres
      - POSTGRES_DB=auction
  mongodb:
    image: mongo
    environment:
        - MONGO_INITDB_ROOT_USERNAME = root
        - MONGO_INITDB_ROOT_PASSWORD = mongopw
    ports:
        - 27017:27017
    volumes:
        - mongodata:/data/db

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
    - 5672:5672
    - 15672:15672

  auction-svc:
    image: varuntomar/auctions-svc:latest
    build:
        context: .
        dockerfile: AuctionWheels.API/Auction.Service/Dockerfile
    environment:
     - ASPNETCORE_ENVIRONMENT=Development
     - ASPNETCORE_URLS=http://+:80
     - RabbitMq__Host=rabbitmq
     - ConnectionStrings__DefaultConnection=Server=postgres;User Id=postgres;Password=varunpost;Database=Auction 
     - IdentityServiceUrl = http://identity-svc
     - Kestrel__Endpoints__Grpc__Protocols=Http2
     - Kestrel__Endpoints__Grpc__Url=http://+:7777
     - Kestrel__Endpoints__WebApi__Protocols=Http1
     - Kestrel__Endpoints__WebApi__Url=Http://+:80
    ports:
      - 7001:80
    depends_on:
      - postgres
      - rabbitmq

  search-svc:
    image: varuntomar/search-svc:latest
    stdin_open: true
    tty: true
    links:
      - "mongodb:mymongo"
    build:
        context: .
        dockerfile: AuctionWheels.API/Search.Service/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:80
      - RabbitMq__Host=rabbitmq
      - ConnectionStrings__MongoDbConnectionString = mongodb://mymongo:27017/SearchDb
      - AuctionServiceUrl = http://auction-svc
    ports:
      - 7002:80
    depends_on:
      - mongodb
      - rabbitmq

  identity-svc:
    image: varuntomar/identity-svc:latest
    build:
        context: .
        dockerfile: AuctionWheels.API/Identity.Service/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=postgres;User Id=postgres;Password=varunpost;Database=Identity
      - IssuerUri=https://id.auctionwheels.local
      - ClientApp=https://app.auctionwheels.local
      - VIRTUAL_HOST=id.auctionwheels.local
    depends_on:
      - postgres
  gateway-svc:
    image: varuntomar/gateway-svc:latest
    build:
        context: .
        dockerfile: AuctionWheels.API/Gateway.Service/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:80
      - VIRTUAL_HOST=api.auctionwheels.local
      - ClientApp=https://app.auctionwheels.local

  bids-svc:
    image: varuntomar/bids-svc:latest
    stdin_open: true
    tty: true
    links:
      - "mongodb:mymongo"
    build:
        context: .
        dockerfile: AuctionWheels.API/Bidding.Service/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - RabbitMq__Host=rabbitmq
      - ConnectionStrings__BidDbConnectionString = mongodb://mymongo:27017/BidDb
      - AuctionServiceUrl = http://auction-svc
      - IdentityServiceUrl = http://identity-svc
      - GrpcAuction=http://auction-svc:7777
    ports:
      - 7003:80
    depends_on:
      - mongodb
      - rabbitmq

  notifications-svc:
    image: varuntomar/notifications-svc:latest
    stdin_open: true
    tty: true
    links:
      - "mongodb:mymongo"
    build:
        context: .
        dockerfile: AuctionWheels.API/Notification.Service/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - RabbitMq__Host=rabbitmq
    ports:
      - 7004:80
    depends_on:
      - rabbitmq
   
  web-app:
    image: varuntomar/web-app
    build:
      context: .
      dockerfile: AutionWheels.UI/auctionwheelsui/Dockerfile
    volumes:
      - /var/lib/web/data
    environment:
      - AUTH_SECRET="KuJDjbgKADkuiTshIepFNracHLile8Tp9sBsDGibxKI="
      - API_URL=http://gateway-svc/
      - AUTH_URL_INTERNAL=http://web-app:3000
      - ID_URL=https://id.auctionwheels.local
      - AUTH_URL=https://app.auctionwheels.local
      - NOTIFY_URL=https://api.auctionwheels.local/notifications
      - AUTH_TRUST_HOST=true
      - ID_URL_INTERNAL=http://identity-svc
      - VIRTUAL_HOST=app.auctionwheels.local
      - VIRTUAL_PORT=3000

  nginx-proxy:
    image: nginxproxy/nginx-proxy
    container_name: nginx-proxy
    ports:
      - 80:80
      - 443:443
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./certs:/etc/nginx/certs

volumes:
  pgData:
  mongodata: